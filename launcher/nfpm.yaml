name: retooled-launcher
arch: amd64
platform: linux
version: ${VERSION}
section: games
priority: optional
maintainer: KSP Retooled
description: Installs and starts KSP Retooled on a stock Kerbal Space Program install.
homepage: https://github.com/KSP1Retooled

overrides:
  deb:
    depends: [libc6, libfontconfig1, libice6, libsm6, libx11-6]
  rpm:
    depends: [fontconfig, libICE, libSM, libX11]

contents:
  - src: app/RetooledLauncher
    dst: /opt/retooled-launcher/RetooledLauncher
    file_info:
      mode: 0755
  - src: app/*.so
    dst: /opt/retooled-launcher/
  - src: /opt/retooled-launcher/RetooledLauncher
    dst: /usr/bin/retooled-launcher
    type: symlink
  - src: retooled-launcher.desktop
    dst: /usr/share/applications/retooled-launcher.desktop
