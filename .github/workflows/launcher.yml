name: Launcher

# Packages the launcher after each CI run, skipping runs cancelled by a newer
# push. It is separate from ci.yml because macOS runners can queue for a long
# time or never arrive, and that must not hold up or fail the `ci` check. The
# bot ignores this workflow: its run-name does not match the CI pattern.
run-name: "Launcher ${{ inputs.sha || github.event.workflow_run.display_title }}"

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit of KSP1Retooled/ksp1retooled to package
        required: true

permissions:
  contents: read

jobs:
  commit:
    name: find commit
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.find.outputs.sha }}
    steps:
      - id: find
        env:
          INPUT: ${{ inputs.sha }}
          # "CI <sha> #<check run id>", from the run-name in ci.yml.
          TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          sha=${INPUT:-$(echo "$TITLE" | cut -d' ' -f2)}
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "no commit in '$sha'"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Native AOT has no cross-OS compilation, so each OS builds on its own runner.
  # macOS can target either architecture from one runner. Linux builds on the
  # oldest available image because the binary needs at least that glibc.
  package:
    name: package (${{ matrix.rid }})
    needs: commit
    runs-on: ${{ matrix.os }}
    environment: ci
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-22.04 }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: KSP1Retooled
          repositories: ksp1retooled

      - uses: actions/checkout@v5
        with:
          repository: KSP1Retooled/ksp1retooled
          ref: ${{ needs.commit.outputs.sha }}
          token: ${{ steps.app.outputs.token }}
          sparse-checkout: |
            Tools/RetooledLauncher
            Tools/RetooledLauncher.Core
            Tools/RetooledPatch
          persist-credentials: false

      # The packaging files, from this repo's own commit.
      - uses: actions/checkout@v5
        with:
          path: ci-repo
          sparse-checkout: launcher
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install the Linux tools
        if: runner.os == 'Linux'
        run: |
          curl -fsSLo nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_amd64.deb
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev ./nfpm.deb

      - name: Install the Windows tools
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress

      - name: Publish
        shell: bash
        run: |
          dotnet publish Tools/RetooledLauncher --configuration Release --runtime "${{ matrix.rid }}" -p:PublishAot=true --output out

      - name: Package
        shell: bash
        run: |
          rm -rf out/*.pdb out/*.dbg out/*.dSYM
          version=$(dotnet msbuild Tools/RetooledLauncher -getProperty:Version | tr -d '\r')
          bash ci-repo/launcher/package.sh "${{ matrix.rid }}" "$version" out artifact
          ls -l artifact

      - uses: actions/upload-artifact@v5
        with:
          name: RetooledLauncher-${{ matrix.rid }}
          path: artifact
          if-no-files-found: error
          retention-days: 7
