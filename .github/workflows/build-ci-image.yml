name: Build CI image

# Publishes the container that Unity jobs run in. Run it by hand after
# changing docker/ksp-ci. The image holds no Unity files or source assets.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: "1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker/ksp-ci
          push: true
          tags: ghcr.io/ksp1retooled/ksp-ci:${{ inputs.tag }}
