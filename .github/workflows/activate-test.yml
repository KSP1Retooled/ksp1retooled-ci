name: Unity activation test

# Throwaway experiment: can a hosted runner activate a Personal license
# headlessly with the editor's licensing client?
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: windows-latest
    environment: ci
    timeout-minutes: 45
    env:
      UNITY_VERSION: 6000.7.0b7
      UNITY_CHANGESET: 74fb57f88838
      UNITY_DIR: C:\Unity
    steps:
      - name: Install editor
        shell: bash
        run: |
          curl -fsSL -o unity-setup.exe \
            "https://download.unity3d.com/download_unity/$UNITY_CHANGESET/Windows64EditorInstaller/UnitySetup64-$UNITY_VERSION.exe"
          ./unity-setup.exe /S "/D=$UNITY_DIR"
          ls "$UNITY_DIR/Editor/Unity.exe"
          df -h /c

      - name: Activate
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          client="$UNITY_DIR/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client.exe"
          "$client" --activate-all --include-personal --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"
          "$client" --showEntitlements

      - name: Headless editor run
        shell: bash
        run: |
          "$UNITY_DIR/Editor/Unity.exe" -batchmode -nographics -quit \
            -createProject "$RUNNER_TEMP/probe" -logFile -

      - name: Deactivate
        if: always()
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          client="$UNITY_DIR/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client.exe"
          "$client" --deactivate-all --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"
